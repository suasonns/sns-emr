name: SNS Governance

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sns-governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-governance:
    name: verify-governance
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test governance verifier
        run: node --test scripts/verify-sns-worktree-rules.test.mjs

      - name: Verify required governance files
        run: node scripts/verify-sns-worktree-rules.mjs

      - name: Run worktree preflight
        run: node scripts/sns-worktree-preflight.mjs

      - name: Confirm governance checks are read-only
        shell: bash
        run: |
          if ! git diff --quiet --exit-code; then
            echo 'Governance checks modified tracked files.' >&2
            git diff --stat
            exit 1
          fi
          if [ -n "$(git diff --cached --name-only)" ]; then
            echo 'Governance checks staged files.' >&2
            git diff --cached --name-only
            exit 1
          fi
