name: preflight

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  preflight:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sns_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # ---------------------------------------------------------
      # 1) Checkout code
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2) Set up Python
      # ---------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ---------------------------------------------------------
      # 3) Install backend dependencies
      # ---------------------------------------------------------
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # ---------------------------------------------------------
      # 4) Create the isolated test database
      #
      # The postgres service only auto-creates POSTGRES_DB (sns_ci, the
      # application-side placeholder database). Tests must run against a
      # PHYSICALLY SEPARATE database (sns_emr_test) so that DATABASE_URL
      # (application) and TEST_DATABASE_URL (tests) never resolve to the
      # same target -- see backend/tests/conftest.py's isolation guard.
      # ---------------------------------------------------------
      - name: Create isolated test database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'sns_emr_test'" | grep -q 1 || \
            psql -h localhost -U postgres -c "CREATE DATABASE sns_emr_test"

      # ---------------------------------------------------------
      # 5) Run Alembic migrations (forward-only) against the test DB
      # ---------------------------------------------------------
      - name: Run Alembic migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/sns_emr_test
        run: |
          alembic upgrade head

      # ---------------------------------------------------------
      # 6) Preflight drift check (current == heads)
      # ---------------------------------------------------------
      - name: Alembic drift check
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/sns_emr_test
        run: |
          alembic current --check-heads
          alembic heads

      # ---------------------------------------------------------
      # 7) Validate DATABASE_URL / TEST_DATABASE_URL are isolated
      #
      # Logs only database names (never credentials) so isolation can be
      # confirmed from the workflow run without exposing secrets.
      # ---------------------------------------------------------
      - name: Validate database isolation
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/sns_ci
          TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/sns_emr_test
        run: |
          app_db="${DATABASE_URL##*/}"
          test_db="${TEST_DATABASE_URL##*/}"
          echo "DATABASE_URL database name:      $app_db"
          echo "TEST_DATABASE_URL database name: $test_db"
          if [ "$app_db" = "$test_db" ]; then
            echo "::error::DATABASE_URL and TEST_DATABASE_URL resolve to the same database ($app_db)."
            exit 1
          fi
          echo "Isolation confirmed: application and test databases are distinct."

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/sns_ci
          TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/sns_emr_test
          APP_ENV: development
          ENV: local
          AUTH_MODE: TOKEN
          SECRET_KEY: ci-secret-key-that-is-at-least-32-characters-long
        run: |
          pytest -q
