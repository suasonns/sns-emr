name: preflight

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  preflight:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sns_emr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # ---------------------------------------------------------
      # 1) Checkout code
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2) Set up Python
      # ---------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ---------------------------------------------------------
      # 3) Install backend dependencies
      # ---------------------------------------------------------
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # ---------------------------------------------------------
      # 4) Run Alembic migrations (forward-only)
      # ---------------------------------------------------------
      - name: Run Alembic migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/sns_emr_test
        run: |
          alembic upgrade head

      # ---------------------------------------------------------
      # 5) Preflight drift check (current == heads)
      # ---------------------------------------------------------
      - name: Alembic drift check
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/sns_emr_test
        run: |
          alembic current --check-heads
          alembic heads

      # ---------------------------------------------------------
      # 6) Run test suite
      # ---------------------------------------------------------
      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/sns_emr_test
          APP_ENV: development
          ENV: local
          AUTH_MODE: TOKEN
          SECRET_KEY: ci-secret-key-that-is-at-least-32-characters-long
        run: |
          pytest -q